name: Unity - request activation file

on:
  workflow_dispatch:

jobs:
  request-activation:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Unity activation request file
        run: |
          mkdir -p activation
          docker run --rm \
            -v "$PWD/activation:/workspace" \
            -w /workspace \
            unityci/editor:ubuntu-2022.3.13f1-base-3.2.2 \
            unity-editor -quit -batchmode -createManualActivationFile -logFile /dev/stdout || true
          echo "=== activation dir ==="
          ls -la activation
          ALF=$(find activation -name 'Unity_v*.alf' | head -n 1)
          if [ -z "$ALF" ]; then
            echo "No Unity_v*.alf file generated"
            exit 1
          fi
          BASENAME=$(basename "$ALF")
          cp "$ALF" "$BASENAME"
          ls -la "$BASENAME"
          echo "ALF_FILE=$BASENAME" >> $GITHUB_ENV

      - name: Convert activation request to Unity license
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          npx -y unity-activate@1.4.1 -o . "$ALF_FILE"
          echo "=== generated files ==="
          ls -la
          ULF=$(find . -maxdepth 1 -name '*.ulf' | head -n 1)
          if [ -z "$ULF" ]; then
            echo "No .ulf file generated"
            exit 1
          fi
          cp "$ULF" Unity_lic.ulf
          ls -la Unity_lic.ulf

      - name: Upload activation files
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: |
            *.alf
            Unity_lic.ulf
          if-no-files-found: error
