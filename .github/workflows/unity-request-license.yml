name: Unity - request activation file

on:
  workflow_dispatch:

jobs:
  request-activation:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Unity activation request file
        run: |
          mkdir -p activation
          docker run --rm \
            -v "$PWD/activation:/workspace" \
            -w /workspace \
            unityci/editor:ubuntu-2022.3.13f1-base-3.2.2 \
            unity-editor -quit -batchmode -createManualActivationFile -logFile /dev/stdout || true
          echo "=== activation dir ==="
          ls -la activation
          ALF=$(find activation -name 'Unity_v*.alf' | head -n 1)
          if [ -z "$ALF" ]; then
            echo "No Unity_v*.alf file generated"
            exit 1
          fi
          cp "$ALF" Unity_v2022.3.13f1.alf
          ls -la Unity_v2022.3.13f1.alf

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: Unity_v2022.3.13f1.alf
          if-no-files-found: error
